[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursorai-docdb"
version = "0.1.0"
description = "Interactive documentation index for LLM and agent platform docs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk",
]

[project.scripts]
docdb = "docdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

